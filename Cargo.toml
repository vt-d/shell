[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
shell-m3e = { path = "crates/shell-m3e" }
shell-motion = { path = "crates/shell-motion" }
shell-render = { path = "crates/shell-render" }
shell-services = { path = "crates/shell-services" }
shell-ui = { path = "crates/shell-ui" }

bytemuck = { version = "1.25.2", features = ["derive"] }
# The version smithay-client-toolkit uses, so sources share one event loop.
calloop = "0.13"
cosmic-text = "0.19"
etagere = "0.3"
inotify = { version = "0.11", default-features = false }
png = "0.18"
zune-jpeg = "0.4"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
libc = "0.2"
resvg = { version = "0.49", default-features = false }
serde_json = "1"
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
# The version cosmic-text uses, so symbols share its image type.
swash = "0.2.10"
taffy = "0.15.1"
wayland-client = { version = "0.31.15", features = ["system"] }
wgpu = "30.0.1"
zbus = "5"
