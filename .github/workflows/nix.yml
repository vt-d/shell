name: Nix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check (${{ matrix.system }})
    environment: Cachix
    env:
      CACHIX_CACHE_NAME: ${{ secrets.CACHIX_CACHE_NAME || vars.CACHIX_CACHE_NAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure public Cachix cache (read only)
        if: env.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Check flake and Home Manager module
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build package for publication
        run: nix build --no-update-lock-file --print-build-logs .#packages.${{ matrix.system }}.default

      # Also build against the pin used by nixos' shell.inputs.nixpkgs.follows.
      - name: Check out NixOS dependency pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vt-d/nixos
          path: .ci/nixos
          persist-credentials: false

      - name: Read NixOS nixpkgs pin
        id: nixos-pin
        shell: bash
        run: |
          nixpkgs_url=$(jq -er '
            .nodes as $nodes
            | $nodes[$nodes[.root].inputs.nixpkgs].locked
            | select(.type == "github")
            | "github:\(.owner)/\(.repo)/\(.rev)?narHash=\(.narHash | @uri)"
          ' .ci/nixos/flake.lock)
          echo "url=$nixpkgs_url" >> "$GITHUB_OUTPUT"
          echo "Building with NixOS nixpkgs: $nixpkgs_url"

      - name: Build package with NixOS nixpkgs
        env:
          NIXPKGS_URL: ${{ steps.nixos-pin.outputs.url }}
        run: |
          nix build --no-write-lock-file --print-build-logs \
            --override-input nixpkgs "$NIXPKGS_URL" \
            --out-link result-nixos .#packages.${{ matrix.system }}.default

      # Only the default branch publishes. PRs and other branches never receive
      # the write token, including PRs originating in this repository.
      - name: Publish runtime closure to Cachix
        if: >-
          env.CACHIX_CACHE_NAME != '' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo 'Set the CACHIX_AUTH_TOKEN repository secret.' >&2; exit 1; }
          cachix push "$CACHIX_CACHE_NAME" "$(readlink -f result)" "$(readlink -f result-nixos)"
